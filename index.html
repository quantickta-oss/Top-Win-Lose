<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P/L Manual System</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    
    /* Sidebar Navigation */
    aside { width: 280px; background-color: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .brand { padding: 20px; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .nav-scroll { flex: 1; overflow-y: auto; padding: 15px; }
    .nav-title { font-size: 0.75rem; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin: 15px 0 5px 10px; letter-spacing: 0.05em; }
    aside button { width: 100%; text-align: left; background: none; border: none; color: var(--text); padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-bottom: 2px; }
    aside button:hover { background-color: rgba(255,255,255,0.05); }
    aside button.active { background-color: var(--primary); color: white; font-weight: 500; }
    
    /* Main Content Area */
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    header { background-color: var(--card-bg); border-bottom: 1px solid var(--border); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    .header-controls { display: flex; gap: 10px; align-items: center; }
    select, input, button.primary { background-color: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; }
    select:focus, input:focus { outline: none; border-color: var(--primary); }
    button.primary { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: 500; }
    button.primary:hover { background-color: var(--primary-hover); }
    
    .content-scroll { flex: 1; overflow-y: auto; padding: 25px; }
    h1 { font-size: 1.5rem; margin-bottom: 5px; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
    
    /* Cards and Tables */
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    .num { text-align: right; }
    
    /* Status & Feedback */
    .notice { background-color: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 0.9rem; color: #93c5fd; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .metric { background-color: var(--bg); border: 1px solid var(--border); padding: 15px; border-radius: 6px; }
    .metric span { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
    .metric strong { font-size: 1.2rem; }
    .pos { color: var(--success); }
    .neg { color: var(--danger); }
    .muted { color: var(--text-muted); }
    
    /* Footer bar status */
    .footer-bar { padding: 10px 25px; background-color: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }
    #status.error { color: var(--danger); font-weight: bold; }
    #status.success { color: var(--success); font-weight: bold; }
  </style>
</head>
<body>

  <!-- Sidebar navigation injected via app.js -->
  <aside>
    <div class="brand">
      <span>P/L Management</span>
    </div>
    <div class="nav-scroll" id="nav"></div>
  </aside>

  <!-- Main Workspace -->
  <main>
    <header>
      <div>
        <h1 id="title">Loading...</h1>
        <div class="subtitle" id="subtitle">Please wait while the platform initializes.</div>
      </div>
      <div class="header-controls">
        <!-- Portal/Group Selector Dropdown -->
        <select id="group-select" aria-label="Select Portal Group">
          <option value="management">Management Portal</option>
          <option value="group1">Group 1 (Awada, BBC, Fawaz, Egypt)</option>
          <option value="group2">Group 2 (Boudani, Cdi, AR, Sh)</option>
          <option value="group3">Group 3 (Connect, Badaro, MT, Tr)</option>
        </select>
        <input type="date" id="date">
        <select id="shift">
          <option value="am">AM Shift</option>
          <option value="pm">PM Shift</option>
          <option value="overnight">Overnight Shift</option>
          <option value="legacy">Daily (Legacy)</option>
        </select>
        <button id="backup">Export JSON</button>
        <button id="restore">Import JSON</button>
        <input type="file" id="backup-file" accept=".json" style="display:none">
      </div>
    </header>

    <div class="content-scroll" id="content">
      <!-- Dynamic views render here -->
    </div>

    <div class="footer-bar">
      <div id="storage">Initializing cloud sync...</div>
      <div id="status">Ready</div>
    </div>
  </main>

  <!-- Configuration and Application Scripts -->
  <script>
    window.PL_CONFIG = {
      enabled: true,
      firebase: {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
      }
    };
  </script>
  <script src="app.js"></script>
</body>
</html>
